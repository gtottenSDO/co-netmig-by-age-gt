project:
  type: website
  output-dir: _site
  render:
    - index.qmd
    - netmig-by-age.qmd
    - dashboard.qmd
  resources:
    - output/*.csv

# The data build (R/00-R/04) downloads public inputs and calls the SDO lookups
# service, and is run locally. Freezing the computed chunk results lets GitHub
# Actions render the site with Quarto alone. Re-run the R scripts
# locally and re-render when the data changes; commit the _freeze directory.
execute:
  freeze: auto

website:
  title: "Colorado Net Migration by Age"
  description: "Net migration by age for Colorado and its counties, 1990-2025"
  site-url: https://gtottensdo.github.io/co-netmig-by-age-gt/
  navbar:
    left:
      - href: index.qmd
        text: Overview
      - href: netmig-by-age.qmd
        text: Report
      - href: dashboard.qmd
        text: Dashboard
  page-footer:
    center: "Colorado State Demography Office"

format:
  html:
    theme: cosmo
    toc: true
    embed-resources: false
